<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

  <meta name="theme-color" content="#0f172a" />
  <title>Sejm 2027</title>
  <link id="pwaManifest" rel="manifest" />
  <link id="pwaAppleIcon" rel="apple-touch-icon" />
  <link id="pwaFavicon" rel="icon" type="image/svg+xml" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-light: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --dem: #38bdf8;
      --dem-bg: rgba(56, 189, 248, 0.14);
      --right: #f87171;
      --right-bg: rgba(248, 113, 113, 0.14);
      --accent: #14b8a6;
      --border: rgba(148, 163, 184, 0.18);
      --zoom-factor: 1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 14px 14px 44px;
      max-width: 580px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.18rem; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .action-btn {
      background: var(--accent);
      color: #042f2e;
      font-weight: 700;
      font-size: 0.73rem;
      padding: 7px 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(20, 184, 166, 0.25);
    }
    .action-btn.secondary {
      background: #38bdf8;
      color: #082f49;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.25);
    }
    .action-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--card);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--card-light);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }
    .tab-view { display: none; }
    .tab-view.active { display: block; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sejm-bar-wrap {
      position: relative;
      height: 36px;
      background: #0f172a;
      border-radius: 9px;
      overflow: hidden;
      display: flex;
      margin: 8px 0 6px;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    .party-seg {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-right: 1px solid rgba(15, 23, 42, 0.65);
      transition: width 0.35s ease;
      padding: 0 1px;
      line-height: 1.0;
    }
    .party-seg:last-of-type { border-right: none; }
    .seg-name {
      font-size: 0.50rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .seg-seats {
      font-size: 0.66rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .majority-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: calc(2px / var(--zoom-factor));
      background: #facc15;
      box-shadow: 0 0 6px rgba(250, 204, 2
